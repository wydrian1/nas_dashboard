<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t d"><title id="t">Az alkalmazás logikai felépítése</title><desc id="d">Böngésző és Android HTTPS-en kapcsolódik a dashboardhoz. A dashboard és a külön worker SQLite-t használ. Az élesítő külön, korlátozott komponens.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3" fill="none" stroke="#68847a" stroke-width="1.4"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="12" y="12" width="936" height="736" rx="20" fill="#101823" stroke="#2c3d4e"/><text x="48" y="63" fill="#a8efc9" font-size="10" letter-spacing="3">ARCHITEKTÚRA / FELELŐSSÉGI HATÁROK</text><rect x="70" y="104" width="360" height="96" rx="12" fill="#1b2938" stroke="#36536a"/><rect x="530" y="104" width="360" height="96" rx="12" fill="#1b2938" stroke="#36536a"/><text x="250" y="144" text-anchor="middle" fill="#edf3f9" font-size="22">Böngésző</text><text x="250" y="174" text-anchor="middle" fill="#91a2b5" font-size="12">Privát webes felület</text><text x="710" y="144" text-anchor="middle" fill="#edf3f9" font-size="22">Android</text><text x="710" y="174" text-anchor="middle" fill="#91a2b5" font-size="12">WebView + natív push / párosítás</text><g fill="none" stroke="#68847a" stroke-width="2" marker-end="url(#arrow)"><path d="M250 200v35h230v20"/><path d="M710 200v35H480v20"/></g><rect x="236" y="261" width="488" height="69" rx="11" fill="#19342b" stroke="#47775f"/><text x="480" y="289" text-anchor="middle" fill="#a8efc9" font-size="18">Caddy · HTTPS kapu</text><text x="480" y="314" text-anchor="middle" fill="#a2b6ad" font-size="11">Tanúsítványkezelés · két domain</text><path d="M480 330v31" stroke="#68847a" stroke-width="2" marker-end="url(#arrow)"/><rect x="171" y="371" width="618" height="97" rx="12" fill="#202b3c" stroke="#4b6478"/><text x="480" y="410" text-anchor="middle" fill="#edf3f9" font-size="24">Dashboard · Next.js + Auth.js</text><text x="480" y="442" text-anchor="middle" fill="#a3b3c8" font-size="12">Szerepkörök · szerveroldali műveletek · privát modulok</text><g fill="none" stroke="#68847a" stroke-width="2" marker-end="url(#arrow)"><path d="M480 468v43"/><path d="M308 609v40h162v-38"/></g><rect x="94" y="533" width="302" height="84" rx="12" fill="#202636" stroke="#5b507a"/><text x="245" y="566" text-anchor="middle" fill="#b6a7ff" font-size="20">Pokémon worker</text><text x="245" y="594" text-anchor="middle" fill="#a8a2ba" font-size="11">Készletfigyelés + push outbox</text><rect x="440" y="522" width="361" height="98" rx="12" fill="#19342b" stroke="#47775f"/><text x="620" y="559" text-anchor="middle" fill="#a8efc9" font-size="24">SQLite</text><text x="620" y="589" text-anchor="middle" fill="#a2b6ad" font-size="12">Állapot · előzmény · audit</text><path d="M396 571h38" stroke="#68847a" stroke-width="2" marker-end="url(#arrow)"/><rect x="69" y="663" width="822" height="52" rx="10" fill="#15202b" stroke="#34485b" stroke-dasharray="6 4"/><text x="480" y="684" text-anchor="middle" fill="#91a2b5" font-size="12">Külön üzemeltetési réteg</text><text x="480" y="706" text-anchor="middle" fill="#edf3f9" font-size="12">Korlátozott élesítő · mentés · megtartott előző build · nem általános adminjog</text></g></svg>

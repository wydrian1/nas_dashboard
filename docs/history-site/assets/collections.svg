<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="t d"><title id="t">Gyűjtemények · kitalált demo adatok</title><desc id="d">Külön LEGO és Pokémon bekerülési nyilvántartás, kitalált árakkal. A történeti pénzügyi adatok nem íródnak át.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect x="8" y="8" width="1104" height="744" rx="20" fill="#0d141d" stroke="#344153"/><rect x="8" y="8" width="1104" height="48" rx="20" fill="#17212e"/><text x="35" y="39" fill="#edf3f9" font-size="14" font-weight="650">wydrian / Gyűjtemények</text><text x="970" y="39" fill="#a8efc9" font-size="10">DEMO ADATOK</text><text x="48" y="105" font-size="10" letter-spacing="2" fill="#a8efc9">BEKERÜLÉSI NYILVÁNTARTÁS</text><text x="48" y="152" font-size="34" font-weight="650" fill="#edf3f9">Gyűjtemények</text><text x="48" y="183" font-size="13" fill="#91a2b5">Vásárlások, mennyiségek, bekerülési értékek — csak adminoknak.</text><rect x="47" y="218" width="1026" height="205" rx="12" fill="#141f2c" stroke="#304255"/><text x="71" y="257" font-size="22" fill="#edf3f9" font-weight="600">LEGO-gyűjtemény</text><rect x="884" y="238" width="164" height="30" rx="6" fill="#233a2f"/><text x="897" y="258" font-size="11" fill="#a8efc9">Minden adat: DEMO</text><g fill="#8195ac" font-size="10"><text x="72" y="302">MEGNEVEZÉS</text><text x="639" y="302">DB</text><text x="716" y="302">EGYSÉGÁR</text><text x="886" y="302">BEKERÜLÉS</text></g><path d="M71 316h978" stroke="#304255"/><g fill="#cdd8e5" font-size="12"><text x="72" y="346">Demo építőkészlet A</text><text x="639" y="346">2</text><text x="716" y="346">20 000 Ft</text><text x="886" y="346">40 000 Ft</text><text x="72" y="384">Demo építőkészlet B</text><text x="639" y="384">1</text><text x="716" y="384">30 000 Ft</text><text x="886" y="384">30 000 Ft</text></g><rect x="47" y="446" width="1026" height="205" rx="12" fill="#141f2c" stroke="#304255"/><text x="71" y="485" font-size="22" fill="#edf3f9" font-weight="600">Pokémon-gyűjtemény</text><text x="894" y="485" font-size="11" fill="#b6a7ff">Külön vásárlási sorok</text><g fill="#8195ac" font-size="10"><text x="72" y="530">MEGNEVEZÉS</text><text x="639" y="530">DB</text><text x="716" y="530">EGYSÉGÁR</text><text x="886" y="530">BEKERÜLÉS</text></g><path d="M71 544h978" stroke="#304255"/><g fill="#cdd8e5" font-size="12"><text x="72" y="574">Demo trainer box</text><text x="639" y="574">2</text><text x="716" y="574">10 000 Ft</text><text x="886" y="574">20 000 Ft</text><text x="72" y="612">Demo trainer box · másik vásárlás</text><text x="639" y="612">1</text><text x="716" y="612">12 000 Ft</text><text x="886" y="612">12 000 Ft</text></g><rect x="47" y="675" width="1026" height="43" rx="8" fill="#1a3229" stroke="#365c49"/><text x="70" y="702" font-size="12" fill="#a8efc9">A gyarapodás a Pénzügy alján látható → Nem új vagyonösszeg, nem automatikus havi mentés.</text><text x="48" y="739" font-size="9" fill="#718398">KITALÁLT TÉTELEK ÉS ÁRAK · NEM A PRIVÁT KEZDŐIMPORT</text></g></svg>

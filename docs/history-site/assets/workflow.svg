<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t d"><title id="t">Az ellenőrzött fejlesztési ciklus</title><desc id="d">Igény és tisztázás után külön task branch, implementáció, teszt, PR és felhatalmazással végzett élesítés következik. Élő ellenőrzés zárja a ciklust.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3" fill="none" stroke="#6d8e7f" stroke-width="1.3"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="12" y="12" width="936" height="736" rx="20" fill="#101823" stroke="#2c3d4e"/><text x="48" y="61" fill="#a8efc9" font-size="10" letter-spacing="3">A KÉRÉSTŐL A BIZONYÍTOTT KIADÁSIG</text><g fill="none" stroke="#6d8e7f" stroke-width="2" marker-end="url(#arrow)"><path d="M431 150h61"/><path d="M708 194v38H249v24"/><path d="M431 317h61"/><path d="M708 361v37H249v24"/><path d="M431 483h61"/><path d="M708 527v35H480v30"/></g><g><rect x="68" y="108" width="363" height="89" rx="11" fill="#19342b" stroke="#47775f"/><rect x="502" y="108" width="363" height="89" rx="11" fill="#19342b" stroke="#47775f"/><rect x="68" y="273" width="363" height="89" rx="11" fill="#1d2b3d" stroke="#46637e"/><rect x="502" y="273" width="363" height="89" rx="11" fill="#1d2b3d" stroke="#46637e"/><rect x="68" y="438" width="363" height="89" rx="11" fill="#242238" stroke="#655584"/><rect x="502" y="438" width="363" height="89" rx="11" fill="#242238" stroke="#655584"/></g><g font-size="10" letter-spacing="1.4"><text x="91" y="133" fill="#a8efc9">01 · TULAJDONOS</text><text x="525" y="133" fill="#a8efc9">02 · BESZÉLGETÉS</text><text x="91" y="298" fill="#97c8ff">03 · OPENCODE</text><text x="525" y="298" fill="#97c8ff">04 · IMPLEMENTÁCIÓ</text><text x="91" y="463" fill="#b6a7ff">05 · ELLENŐRZÉS</text><text x="525" y="463" fill="#b6a7ff">06 · GITHUB</text></g><g fill="#edf3f9" font-size="21" font-weight="600"><text x="91" y="169">Valós igény</text><text x="525" y="169">Kérdések + döntések</text><text x="91" y="334">Feltárás + task branch</text><text x="525" y="334">Kis, célzott változás</text><text x="91" y="499">Tesztek + staging build</text><text x="525" y="499">Commit + pull request</text></g><rect x="181" y="594" width="598" height="99" rx="12" fill="#19342b" stroke="#47775f"/><text x="480" y="626" text-anchor="middle" font-size="10" fill="#a8efc9" letter-spacing="1.6">07 · KÜLÖN FELHATALMAZÁS</text><text x="480" y="663" text-anchor="middle" font-size="21" fill="#edf3f9" font-weight="600">Merge → élesítés → élő ellenőrzés</text><text x="480" y="721" text-anchor="middle" fill="#8297a8" font-size="11">A meglévő adatok és szolgáltatások megőrzése minden lépés része.</text></g></svg>

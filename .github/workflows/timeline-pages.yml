name: Timeline on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/history-site/**'
      - 'docs/history-site.test.mjs'
      - 'scripts/Build-Timeline-Pages.mjs'
      - 'tests/timeline-pages.test.ts'
      - '.github/workflows/timeline-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeline-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check presentation and publication boundary
        run: node --experimental-strip-types --test docs/history-site.test.mjs tests/timeline-pages.test.ts
      - name: Package only reviewed timeline files
        run: node scripts/Build-Timeline-Pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .timeline-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy timeline
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
